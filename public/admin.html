<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner view · MUIR Tech</title>
<meta name="robots" content="noindex">
<meta name="description" content="Sign in to see your MUIR Tech jobs and message us.">
<meta property="og:title" content="Website Design · MUIR Tech">
<meta property="og:description" content="We turn lifeless, broken or outdated websites into sites that capture your audience and flow with simplicity and grace.">
<meta property="og:url" content="https://muirtech.net/account">
<meta property="og:type" content="website">
<meta property="og:image" content="https://muirtech.net/assets/muirtech-lockup-dark.png">
<link rel="icon" href="assets/muirtech-lockup-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030608;--teal:#125A72;--teal2:#2A8FB0;--gold:#C3AF75;--gold2:#8F7B45;--ink:#EEF3F5;--mut:#B3C2C9;--glassA:rgba(255,255,255,.08);--glassB:rgba(255,255,255,.015);--line:rgba(255,255,255,.12);--obj:screen}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',sans-serif;font-size:19px;line-height:1.55}
h1,h2,h3{font-family:'MUIR Tech Display','Syne',sans-serif;margin:0;letter-spacing:-.02em}
.it{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:var(--gold);letter-spacing:0}
a{color:var(--gold)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:8px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--gold);color:var(--bg);padding:12px 16px;z-index:99;border-radius:8px}
.wrap{width:100%;max-width:1360px;margin:0 auto;overflow:hidden;position:relative;background:radial-gradient(ellipse 46% 34% at 72% 18%,rgba(195,175,117,.16),transparent 70%),radial-gradient(ellipse 50% 40% at 20% 60%,rgba(17,90,116,.14),transparent 72%),var(--bg)}
.glass{background:linear-gradient(160deg,var(--glassA),var(--glassB));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
/* header */
.nav{position:sticky;top:0;z-index:20;margin:14px 20px 0;padding:10px 14px 10px 12px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.nav a.l{color:var(--ink);text-decoration:none;padding:12px 4px;font-size:18px;position:relative}
.nav a.l::after{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a.l:hover::after{transform:scaleX(1)}
/* keys */
.key{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:'MUIR Tech Display','Syne',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border-radius:14px;padding:16px 26px;min-height:56px;cursor:pointer;transition:transform .12s,border-bottom-width .12s,background-color .2s,box-shadow .2s}
.key::before{content:"";width:11px;height:11px;border-radius:50%;flex:none;transition:background .2s,box-shadow .2s}
.k1{background:var(--gold);color:var(--bg);border:0;border-bottom:8px solid var(--gold2)}.k1::before{background:var(--bg)}
.k1:hover{background:#D6C48B;box-shadow:0 0 32px rgba(195,175,117,.45)}
.k2{background:#125A72;color:var(--ink);border:1px solid rgba(255,255,255,.22);border-bottom:8px solid #04222D}.k2::before{background:var(--teal2)}
.k2:hover{background:#17708E}
.key:hover::before{background:#3DE08A;box-shadow:0 0 10px 3px rgba(61,224,138,.7)}
.key:active{border-bottom-width:2px;transform:translateY(6px)}
.pulse::before{animation:led 1.8s infinite}@keyframes led{50%{background:#3DE08A;box-shadow:0 0 10px 3px rgba(61,224,138,.7)}}
/* hero */
.hero{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;padding:56px 40px 84px}
.eyebrow{font-family:'MUIR Tech Display','Syne',sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}
.hero h1{font-size:clamp(42px,7vw,100px);line-height:1;font-weight:800}
.ln{opacity:0;animation:up .8s forwards}.l1{animation-delay:.2s}.l2{animation-delay:.6s}.l3{animation-delay:1s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stage{flex:1 1 420px;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{position:relative;width:min(520px,82vw);z-index:2}
.logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
html:has(#theme option[value="light"]:checked) .lk-d{display:none!important}html:has(#theme option[value="light"]:checked) .lk-l{display:block!important}
.halo{position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(195,175,117,.9) 75%,transparent 95%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.obj{position:absolute;pointer-events:none;z-index:1;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.o1{width:120px;height:120px;left:0;bottom:150px;perspective:2400px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45))}
.cube3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin3d 16s linear infinite}
.cf{position:absolute;inset:0;border-radius:16px;border:1px solid rgba(235,225,190,.55);background:linear-gradient(120deg,rgba(90,220,235,.38),rgba(17,90,116,.18) 30%,rgba(195,175,117,.28) 50%,rgba(42,143,176,.22) 70%,rgba(120,230,240,.4)) 0 0/300% 300%;box-shadow:inset 0 0 26px rgba(140,230,245,.35),inset 6px 6px 14px rgba(255,255,255,.22);backface-visibility:visible;animation:liquid 5s ease-in-out infinite alternate;overflow:hidden}
.cf::after{content:"";position:absolute;inset:-30%;background:radial-gradient(ellipse 35% 22% at 30% 25%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 50% 30% at 70% 80%,rgba(120,240,255,.25),transparent 70%);animation:slosh 3.6s ease-in-out infinite alternate}
@keyframes liquid{to{background-position:100% 100%}}@keyframes slosh{0%{transform:translate(-8%,-4%) rotate(-6deg)}100%{transform:translate(8%,6%) rotate(8deg)}}
.f1{transform:translateZ(60px)}.f2{transform:rotateY(180deg) translateZ(60px)}.f3{transform:rotateY(90deg) translateZ(60px)}.f4{transform:rotateY(-90deg) translateZ(60px)}.f5{transform:rotateX(90deg) translateZ(60px)}.f6{transform:rotateX(-90deg) translateZ(60px)}
@keyframes spin3d{from{transform:rotateX(0) rotateY(0) rotateZ(0)}to{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg)}}
@media (prefers-reduced-motion:reduce){.kglow,.kinline{animation:none}.kglow{opacity:0}.cf,.cf::after{animation:none}.cube3d{animation:none;transform:rotateX(-22deg) rotateY(34deg)}}
.o3{width:120px;right:0;bottom:140px;transform-origin:50% 100%;animation:press 2.6s cubic-bezier(.5,0,.3,1) infinite}
.kinline{position:relative;width:99px;align-self:center;margin-left:auto;margin-right:auto;transform-origin:50% 100%;animation:press 2.6s cubic-bezier(.5,0,.3,1) infinite;filter:drop-shadow(0 18px 22px rgba(0,0,0,.5));isolation:isolate}
#svc-h{font-size:clamp(42px,6vw,78px);max-width:none}#services .svchead .sub{font-size:25px}
.adbox{margin-top:10px;padding:34px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.adtag{display:inline-block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:999px;padding:4px 12px}
.adname{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(30px,4vw,48px);margin:14px 0 6px;color:var(--gold)}
.adline{margin:0;font-size:21px}.adwhere{margin:6px 0 0;color:var(--mut);font-size:18px}
.adslide{animation:adin .6s ease}@keyframes adin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.adctl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.addots{display:flex;gap:10px}.addots button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;position:relative}.addots button::after{content:"";position:absolute;inset:16px;border-radius:50%;background:rgba(255,255,255,.3)}.addots button.on::after{background:var(--gold)}
.adpause{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.adcta{margin-top:20px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.adslide{animation:none}}
.svchead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:20px}
.hdrlogo{width:min(642px,100%);max-width:100%;height:auto}
.navlinks{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 18px;width:100%;padding:4px 8px;border-top:1px solid rgba(195,175,117,.35);border-bottom:1px solid rgba(195,175,117,.35)}
.navlinks a.l{font-size:clamp(20px,2.4vw,28px);font-weight:600}
.langs{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px}.langs button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:8px 10px;min-height:40px;cursor:pointer}.langs button[aria-pressed="true"]{background:#C3AF75;color:#0A1A21}
.logoband{display:flex;justify-content:flex-start;margin:-10px -14px 4px -12px;padding:14px 16px;width:calc(100% + 26px);box-sizing:border-box;background:transparent;border-radius:22px 22px 0 0}
.cubeside{position:relative;flex:none;margin:0 70px 84px 0;width:120px;height:120px;perspective:2400px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45))}
.kglow{position:absolute;left:-12%;right:-12%;bottom:-16%;height:34%;pointer-events:none;z-index:-1;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(120,245,255,.95),rgba(42,200,230,.55) 35%,rgba(42,143,176,0) 70%);filter:blur(6px);opacity:0;animation:kglow 2.6s ease-out infinite}
@keyframes kglow{0%,52%{opacity:0;transform:scale(.7)}58%{opacity:1;transform:scale(1.05)}88%{opacity:.95;transform:scale(1)}96%,100%{opacity:0;transform:scale(.8)}}
@keyframes press{0%,52%,100%{transform:translateY(0) scaleY(1)}57%{transform:translateY(14px) scaleY(.93)}88%{transform:translateY(14px) scaleY(.93)}95%{transform:translateY(-3px) scaleY(1.01)}}

.chipfx{position:relative}.hchip{width:min(330px,70vw);margin-top:84px;z-index:2;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.chipfx img{width:100%;height:auto;display:block}
.chipfx .wirecv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}

@keyframes fl{50%{transform:translateY(-22px) rotate(4deg)}}
/* marquee */
.mq{border-block:1px solid var(--line);padding:16px 0;overflow:hidden;background:transparent;opacity:.75}
.run{display:flex;gap:56px;width:max-content;animation:run 27.8s linear infinite;font-family:'MUIR Tech Display','Syne',sans-serif;font-weight:700;letter-spacing:.14em;color:var(--gold);font-size:22px}
@keyframes run{to{transform:translateX(-50%)}}
/* sections */
.pic{margin:34px 0 0;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35)}.pic img{display:block;width:100%;height:auto}
.sec{padding:84px 40px 20px}
.sec h2{font-size:clamp(32px,4.6vw,60px);line-height:1.05;font-weight:800;max-width:900px}
.sub{color:var(--mut);margin:14px 0 36px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;align-items:start}
details.win{transition:transform .25s,border-color .25s,box-shadow .25s}
details.win:hover{transform:translateY(-6px);border-color:rgba(195,175,117,.7);box-shadow:0 26px 60px rgba(0,0,0,.45),0 0 40px rgba(195,175,117,.18)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 28px}
summary::-webkit-details-marker{display:none}
.num{font-family:'Fraunces',serif;font-style:italic;color:var(--gold);font-size:30px;margin-right:16px}
.st{font-family:'MUIR Tech Display','Syne',sans-serif;font-weight:700;font-size:clamp(20px,2.2vw,26px)}
.pl{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;color:var(--gold);font-size:26px;flex:none;transition:transform .25s,background .25s}
details[open] .pl{transform:rotate(45deg);background:rgba(195,175,117,.18)}
details[open] .bd{animation:up .45s}
.bd{margin:0;padding:0 28px 28px 74px;color:var(--mut);list-style:none}
.bd li{padding:7px 0 7px 22px;position:relative}.bd li::before{content:"";position:absolute;left:0;top:19px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
/* ai */
.ai{margin:84px 40px 0;padding:44px;display:flex;flex-wrap:wrap;gap:30px 48px;align-items:center;position:relative;overflow:hidden}
.ai .obj{position:static;width:min(320px,80%);margin:14px auto 0}
.tags{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.tags li{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 18px;font-size:17px;background:rgba(255,255,255,.04);transition:border-color .2s,background .2s}
.tags li:hover{border-color:var(--gold);background:rgba(195,175,117,.12)}
/* photos */
.ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.ph figure{margin:0;aspect-ratio:4/3;border-radius:18px;border:1px dashed rgba(195,175,117,.55);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mut);background:rgba(255,255,255,.03);transition:transform .25s,background .25s}
.ph figure:hover{transform:scale(1.03);background:rgba(195,175,117,.08)}
/* how */
.steps{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px}
.steps li{padding:30px;transition:transform .25s,border-color .25s}
.steps li:hover{transform:translateY(-6px);border-color:rgba(195,175,117,.7)}
.steps .n{font-family:'Fraunces',serif;font-style:italic;font-size:84px;line-height:.9;color:var(--gold)}
.steps p{margin:12px 0 0;font-size:21px}
/* contact */
.ct{margin:84px 40px 0;padding:44px;display:flex;flex-wrap:wrap;gap:40px}
.ct>div{flex:1 1 360px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:18px}
.field input,.field select,.field textarea{font:inherit;font-size:19px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(4,22,30,.8);color:var(--ink)}
.msgwide{flex:1 1 100%;min-width:0}.msgwide textarea{width:100%;box-sizing:border-box;min-height:260px;resize:vertical;line-height:1.5}
.cq{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:10px}.cq button{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}.cq button:hover{border-color:var(--gold);background:rgba(195,175,117,.14)}
.sug{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin-top:8px}.sug button{font:inherit;font-size:16px;color:var(--bg);background:var(--gold);border:0;border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
.links{display:flex;flex-direction:column;gap:12px;margin-top:26px;align-items:flex-start}
.foot{margin-top:84px;padding:26px 40px 100px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-wrap:wrap;gap:10px 32px;justify-content:space-between;color:var(--mut);font-size:17px}
.bar{display:none}
@media (max-width:700px){.cubeside{width:84px;height:84px;margin:0 20px 36px 0}.kinline{width:78px}.cf.f1{transform:translateZ(42px)}.cf.f2{transform:rotateY(180deg) translateZ(42px)}.cf.f3{transform:rotateY(90deg) translateZ(42px)}.cf.f4{transform:rotateY(-90deg) translateZ(42px)}.cf.f5{transform:rotateX(90deg) translateZ(42px)}.cf.f6{transform:rotateX(-90deg) translateZ(42px)}.bar{display:flex;position:sticky;bottom:0;gap:10px;padding:10px 12px;background:rgba(6,22,29,.92);border-top:1px solid rgba(195,175,117,.6);z-index:30}.bar .key{flex:1;padding:14px 10px}.hero{padding:36px 20px 60px}.sec,.foot{padding-left:20px;padding-right:20px}.ai,.ct{margin-left:20px;margin-right:20px;padding:26px}.stage{min-height:0}.hchip{margin-top:60px}.o1{width:84px;height:84px;bottom:110px}.hchip{width:min(240px,60vw)}.o3{width:84px;bottom:100px}.bd{padding-left:28px}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}.halo,.obj,.run,.pulse::before,.ai .obj{animation:none}.key,details.win,.steps li,.ph figure,.pl{transition:none}.key:hover,.key:active,details.win:hover,.steps li:hover,.ph figure:hover{transform:none}}

/* tips */
.tips{margin:64px 40px 0;padding:30px 34px;position:relative}
.tips h2{font-size:clamp(24px,3vw,34px)}
.tipbox{position:relative;min-height:112px;margin-top:14px}
.tip{position:absolute;inset:0;margin:0;font-size:clamp(20px,2.4vw,26px);line-height:1.4;opacity:0;animation:tipcycle 24s infinite}
.tip:nth-child(2){animation-delay:6s}.tip:nth-child(3){animation-delay:12s}.tip:nth-child(4){animation-delay:18s}
@keyframes tipcycle{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
.tipctl{display:flex;align-items:center;gap:12px;margin-top:10px;color:var(--mut);font-size:17px}
.tipctl input{width:24px;height:24px;accent-color:var(--gold)}
.tips:has(#tp:checked) .tip{animation-play-state:paused}
.tips:has(#tp:checked) .tip:first-child{opacity:1;animation:none}
/* access */
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;margin-top:30px}
.acc li{padding:28px;list-style:none}
.acc h3{font-size:24px;margin-bottom:8px}
.acc p{margin:0;color:var(--mut)}
/* assistant */
.asst{position:fixed;right:20px;bottom:20px;z-index:40;max-width:min(380px,calc(100vw - 32px))}
.asst>summary{display:inline-flex;align-self:flex-end}

.asst .panel{margin-bottom:12px;padding:22px;max-height:60vh;overflow:auto;background:rgba(6,22,29,.97)}
.asst h2{font-size:22px;margin-bottom:6px}
.asst .chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.asst .chat p{margin:0;padding:10px 14px;border-radius:14px;font-size:17px;line-height:1.45;max-width:92%;white-space:pre-line}
.asst .chat .bot{background:rgba(255,255,255,.07);border:1px solid var(--line);align-self:flex-start}
.asst .chat .me{background:rgba(195,175,117,.22);align-self:flex-end}
.asst .cbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.asst .cb{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--gold);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.asst .hand{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.asst .hand input,.asst .cin input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(4,22,30,.8);color:var(--ink);min-height:44px}
.asst .cin{display:flex;gap:8px;align-items:stretch}.asst .cin input{flex:1;min-width:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html:has(#theme option[value="light"]:checked) .asst .hand input,html:has(#theme option[value="light"]:checked) .asst .cin input{background:#fff;color:#0A1A21}
.asst .q{border-top:1px solid rgba(255,255,255,.14)}
.asst .q summary{padding:14px 4px;font-family:'MUIR Tech Display','Syne',sans-serif;font-weight:700;font-size:17px}
.asst .q p{margin:0 0 14px;color:var(--mut);font-size:18px}
.asst{display:flex;flex-direction:column}
@media (max-width:700px){.tips{margin:44px 20px 0;padding:24px}.tipbox{min-height:84px}.asst{right:12px;bottom:84px}}
@media (prefers-reduced-motion:reduce){.tip{position:static;opacity:1;animation:none;margin-bottom:14px}.tipbox{min-height:0}.tips:has(#tp:checked) .tip{animation:none}.tipctl{display:none}}

/* theme dropdown: dark by default, Light = the reverse */
.theme{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--mut)}

<script>
(function(){
var $=function(i){return document.getElementById(i)},D=null,cur=null;
var KINDS=['Computer repair','Upgrade or new build','Wi-Fi or network','Printer or devices','Audio or studio setup','Website','AI coaching','Shipping','Something else'];
var STAT=['New request','Scheduled','In progress','Waiting on parts','Ready for pickup','Done'];
KINDS.forEach(function(k){var o=document.createElement('option');o.textContent=k;$('aKi').appendChild(o)});
function api(p,b){return fetch(p,b?{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json().catch(function(){return{ok:false,error:'Error'}})})}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function when(ms){return ms?new Date(ms).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'never'}
function thread(list){var t=el('div','thread');if(!list.length)t.appendChild(el('p','muted','No messages yet.'));list.slice().sort(function(a,b){return a.id-b.id}).forEach(function(m){var b=el('div','bub '+(m.sender==='customer'?'c':'m'),m.body);b.appendChild(el('time','',(m.sender==='customer'?'Customer':'You')+' · '+when(m.created)));t.appendChild(b)});setTimeout(function(){t.scrollTop=t.scrollHeight},0);return t}
function replyBox(email,pid){var f=el('form');var ta=el('textarea');ta.placeholder='Reply (they get an email or text)';ta.setAttribute('aria-label','Reply');var r=el('div','row');var b=el('button','key k1','Send reply');b.type='submit';r.appendChild(b);var m=el('p','msg');m.hidden=true;f.appendChild(ta);f.appendChild(r);f.appendChild(m);
 f.onsubmit=function(e){e.preventDefault();if(!ta.value.trim())return;b.disabled=true;api('/api/admin/message',{email:email,projectId:pid,body:ta.value}).then(function(x){b.disabled=false;if(!x.ok){m.hidden=false;m.className='msg bad';m.textContent=x.error;return}load(email)})};return f}
function render(){var q=$('find').value.toLowerCase(),L=$('list');L.innerHTML='';
 var unread={};D.messages.forEach(function(m){if(m.sender==='customer'&&!m.seen_muir)unread[m.email]=(unread[m.email]||0)+1});
 var st=$('stats');st.innerHTML='';[['Customers',D.users.length],['Open jobs',D.projects.filter(function(p){return p.status!=='Done'}).length],['Unread messages',Object.keys(unread).reduce(function(a,k){return a+unread[k]},0)]].forEach(function(x){var d=el('div');d.appendChild(el('b','',x[1]));d.appendChild(document.createTextNode(x[0]));st.appendChild(d)});
 D.users.slice().sort(function(a,b){return (unread[b.email]||0)-(unread[a.email]||0)}).filter(function(u){return !q||(u.email+' '+(u.name||'')).toLowerCase().indexOf(q)>=0}).forEach(function(u){var b=el('button','cust'+(u.email===cur?' on':''));b.type='button';b.appendChild(el('b','',u.name||u.email));b.appendChild(el('small','',u.email+(u.phone?' · '+u.phone:'')));if(unread[u.email])b.appendChild(el('span','dot',unread[u.email]));b.onclick=function(){cur=u.email;api('/api/admin/seen',{email:u.email});D.messages.forEach(function(m){if(m.email===u.email)m.seen_muir=1});render();detail()};L.appendChild(b)});
 if(cur)detail()}
function detail(){var u=D.users.filter(function(x){return x.email===cur})[0],box=$('detail');box.innerHTML='';if(!u)return;
 var p=el('div','glass pane');p.appendChild(el('h2','',u.name||u.email));p.appendChild(el('p','muted',u.email+(u.phone?' · '+u.phone:'')+(u.address?' · '+u.address:'')+' · tell them by '+(u.notify||'email')+' · joined '+when(u.created)+' · last in '+when(u.last_in)));
 p.appendChild(el('h3','','General messages'));p.appendChild(thread(D.messages.filter(function(m){return m.email===cur&&!m.project_id})));p.appendChild(replyBox(cur,null));box.appendChild(p);
 D.projects.filter(function(x){return x.email===cur}).forEach(function(j){var c=el('div','glass pane job');c.appendChild(el('h3','',j.title));c.appendChild(el('p','muted',j.kind+' · started '+when(j.created)));if(j.details)c.appendChild(el('p','',j.details));
  var r=el('div','row');var s=el('select');s.setAttribute('aria-label','Status');STAT.concat(STAT.indexOf(j.status)<0?[j.status]:[]).forEach(function(x){var o=el('option','',x);if(x===j.status)o.selected=true;s.appendChild(o)});var tl=el('label');tl.style.cssText='display:flex;gap:6px;align-items:center;margin:0;font-weight:400';var cb=el('input');cb.type='checkbox';cb.checked=true;cb.style.width='auto';tl.appendChild(cb);tl.appendChild(document.createTextNode('Tell the customer'));var sb=el('button','key k2','Update status');sb.type='button';sb.onclick=function(){sb.disabled=true;api('/api/admin/project',{id:j.id,status:s.value,tell:cb.checked}).then(function(){load(cur)})};r.appendChild(s);r.appendChild(tl);r.appendChild(sb);c.appendChild(r);
  c.appendChild(thread(D.messages.filter(function(m){return m.project_id===j.id})));c.appendChild(replyBox(cur,j.id));box.appendChild(c)})}
function load(keep){api('/api/admin').then(function(r){if(!r.ok){$('aMsg').hidden=false;$('aMsg').innerHTML='';$('aMsg').appendChild(document.createTextNode(r.error+' '));var a=el('a','','Sign in');a.href='/account';$('aMsg').appendChild(a);return}D=r;$('aBody').hidden=false;cur=keep||cur;render()})}
$('find').oninput=render;
$('fAdd').onsubmit=function(e){e.preventDefault();api('/api/admin/project',{email:$('aEm').value,title:$('aTi').value,kind:$('aKi').value,status:$('aSt').value,details:$('aDe').value}).then(function(r){var m=$('addMsg');m.hidden=false;m.className='msg '+(r.ok?'good':'bad');m.textContent=r.ok?'Added.':r.error;if(r.ok){cur=$('aEm').value.toLowerCase().trim();$('fAdd').reset();$('aSt').value='Scheduled';load(cur)}})};
load();setInterval(function(){if(document.visibilityState==='visible')load()},60000);
})();
</script>
